name: Validate and build voiceover recovery
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/voiceover-validation.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hdrezka-voiceover-names
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: python3 server/test_local_api.py
      - name: Retain existing public client configuration
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs'), assert=require('assert/strict'), parser=require('@babel/parser');
          const html=fs.readFileSync('docs/index.html','utf8');
          const asset=html.match(/type="module" crossorigin src="([^"]+)"/)[1];
          const code=fs.readFileSync('docs'+asset,'utf8');
          const nodes=parser.parse(code,{sourceType:'module'}).program.body.filter(n=>n.type==='VariableDeclaration').flatMap(n=>n.declarations);
          const api=nodes.find(n=>n.init?.type==='StringLiteral'&&n.init.value==='https://hades.20-235-109-146.sslip.io/api');
          assert(api);
          const firebase=nodes.find(n=>n.init?.type==='ObjectExpression'&&n.init.properties.some(p=>p.key?.name==='messagingSenderId'));
          assert(firebase);
          const values=nodes.filter(n=>n.start>firebase.end&&n.init?.type==='StringLiteral').slice(0,4).map(n=>n.init.value);
          assert.equal(values.length,4); assert.match(values[2],/^https:\/\//);
          const admin=nodes.find(n=>n.start>api.start&&n.start<api.start+2000&&n.init?.type==='StringLiteral'&&/^[^@]+@[^@]+$/.test(n.init.value));
          assert(admin);
          const env={VITE_HADES_API_URL:api.init.value,VITE_TMDB_KEY:values[0],VITE_COLLAPS_TOKEN:values[1],VITE_COLLAPS_API:values[2],VITE_ALLOHA_TOKEN:values[3],VITE_ADMIN_EMAIL:admin.init.value,VITE_WHITELIST:'on'};
          const names={apiKey:'API_KEY',authDomain:'AUTH_DOMAIN',projectId:'PROJECT_ID',storageBucket:'STORAGE_BUCKET',messagingSenderId:'MESSAGING_SENDER_ID',appId:'APP_ID',measurementId:'MEASUREMENT_ID'};
          for(const p of firebase.init.properties){assert(names[p.key.name]);assert.equal(p.value.type,'StringLiteral');env['VITE_FIREBASE_'+names[p.key.name]]=p.value.value;}
          assert.equal(Object.keys(env).length,14);
          fs.writeFileSync('.env',Object.entries(env).map(([k,v])=>k+'='+JSON.stringify(v)).join('\n')+'\n');
          console.log('Retained existing public settings; values omitted.');
          JS
      - run: npm run build
      - name: Verify configuration and save production assets
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs'),assert=require('assert/strict');
          const html=fs.readFileSync('docs/index.html','utf8'),asset=html.match(/type="module" crossorigin src="([^"]+)"/)[1],code=fs.readFileSync('docs'+asset,'utf8');
          const env=Object.fromEntries(fs.readFileSync('.env','utf8').trim().split('\n').map(l=>{const i=l.indexOf('=');return[l.slice(0,i),JSON.parse(l.slice(i+1))]}));
          for(const [k,v] of Object.entries(env))if(k!=='VITE_WHITELIST')assert(code.includes(JSON.stringify(v)),k);
          assert(!code.includes('ci-dummy'));console.log('PASS: public client settings preserved.');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          git diff --cached --quiet && exit 0
          git commit -m 'Build verified production voiceover recovery UI'
          git push origin HEAD:fix/hdrezka-voiceover-names
