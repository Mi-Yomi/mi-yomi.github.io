name: HDRezka network diagnostic
on:
  push:
    branches: [fix/hdrezka-recovery-20261030]
    paths: [.github/workflows/rezka-diagnostic.yml, server/local-api.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual movie and series resolution
        shell: python
        run: |
          import importlib.util, json
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse
          spec = importlib.util.spec_from_file_location('api', 'server/local-api.py')
          api = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(api)
          for title, year, kind in [('Интерстеллар', '2014', 'movie'), ('Во все тяжкие', '2008', 'tv')]:
            embed, picked = api.rezka_resolve(title, year, kind)
            assert embed, (title, picked)
            assert picked['title'] == title, picked
            assert picked['year'] == year, picked
            assert picked['isSeries'] == (kind == 'tv'), picked
            assert '/embed/trailer/' not in embed, embed
            req = Request(embed, headers={'User-Agent': api.REZKA_UA, 'Referer': 'https://mi-yomi.github.io/'})
            with urlopen(req, timeout=15) as response:
              body = response.read(1_000_000).decode('utf-8', 'ignore')
              assert response.status == 200
              print(json.dumps({'title': title, 'picked': picked, 'embed_host': urlparse(embed).hostname,
                                'embed_path': urlparse(embed).path, 'player_http': response.status,
                                'player_bytes': len(body)}, ensure_ascii=False))
          assert api.rezka_search('hades-network-diagnostic-title-that-does-not-exist-20261030') == []
          print('PASS: missing titles do not select unrelated recommendations')
